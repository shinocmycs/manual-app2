<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101d">
<title>設定マニュアル</title>
<style>
:root{--bg:#07101d;--card:#0d1928;--line:#26364a;--blue:#2675e8;--muted:#91a5bc}
*{box-sizing:border-box}
html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden;background:var(--bg);color:#edf4fc;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
button,input{font:inherit}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;width:100%;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:rgba(7,16,29,.96);border-bottom:1px solid var(--line)}
header small{display:block;color:#6ca8ff;font-size:9px;letter-spacing:.18em}
h1{margin:2px 0 0;font-size:19px}
header button{border:0;background:transparent;color:#fff;font-size:25px;padding:8px}
main{width:100%;max-width:760px;margin:0 auto;padding:8px;overflow-x:hidden}
.search,.box{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:8px}
.search{position:sticky;top:67px;z-index:15;padding:9px}
.searchbar{display:flex;align-items:center;width:100%;gap:7px;padding:0 9px;border:1px solid #344a66;border-radius:11px;background:#07101d}
.searchbar input{display:block;flex:1;min-width:0;width:100%;border:0;outline:0;background:transparent;color:#fff;font-size:16px;padding:12px 0}
.searchbar input::placeholder{color:#71849b}
#clear{border:0;background:transparent;color:#fff;font-size:23px;padding:4px 2px}
#chips{display:flex;flex-wrap:wrap;gap:6px;padding-top:8px}
.chip{border:1px solid #344a66;background:#0b1725;color:#bdd0e6;border-radius:999px;padding:6px 10px;font-size:12px}
.chip.active{background:var(--blue);border-color:var(--blue);color:#fff}
.head,.vhead{display:flex;align-items:center;gap:7px;padding:10px 11px;border-bottom:1px solid var(--line)}
.head span,.vhead span{margin-left:auto;color:#8da0b7;font-size:12px;flex:0 0 auto}
#results{width:100%}
.item{display:block;width:100%;border:0;border-bottom:1px solid #1e2c3d;background:transparent;color:#fff;text-align:left;padding:12px 11px}
.item:last-child{border-bottom:0}
.item .top{display:flex;align-items:center;gap:7px;min-width:0}
.badge{flex:0 0 auto;font-size:10px;border:1px solid #2b6099;color:#86baff;border-radius:999px;padding:3px 6px}
.ptitle{flex:1;min-width:0;font-weight:700;white-space:normal;overflow-wrap:anywhere}
.pg{flex:0 0 auto;color:#788ba3;font-size:11px}
.desc{display:block;color:var(--muted);font-size:12px;line-height:1.5;margin-top:5px;white-space:normal;overflow-wrap:anywhere}
.hidden{display:none!important}
.vhead{position:sticky;top:67px;z-index:12;background:var(--card)}
#back{border:0;background:transparent;color:#fff;font-size:13px;padding:8px 4px;flex:0 0 auto}
.vhead b{flex:1;min-width:0;font-size:13px;white-space:normal;overflow-wrap:anywhere}
/* One source image contains 3 vertical pages. We display it at natural width and
   move only the selected third into a viewport with the REAL page ratio 910x1287. */
#pageViewport{position:relative;width:100%;aspect-ratio:910/1287;background:#fff;overflow:hidden}
#pageImage{position:absolute;left:0;top:0;width:100%;height:auto;max-width:100%;display:block;user-select:none;-webkit-user-drag:none}
.nav{position:sticky;bottom:0;z-index:12;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;width:100%;padding:9px;background:rgba(13,25,40,.97);border-top:1px solid var(--line)}
.nav button{min-width:0;border:1px solid #344a66;border-radius:10px;background:#101f31;color:#fff;padding:11px 4px;font-size:13px}
.nav button:disabled{opacity:.3}
@media(min-width:600px){main{padding:12px} .search{top:72px} .vhead{top:72px}}
</style>
</head>
<body>
<header>
  <div><small>SETTING MANUAL</small><h1>設定マニュアル</h1></div>
  <button id="toc" type="button" aria-label="目次">☰</button>
</header>

<main>
  <section class="search">
    <div class="searchbar">
      <span aria-hidden="true">🔎</span>
      <input id="q" type="text" inputmode="search" autocomplete="off" autocapitalize="none"
             placeholder="FAX、SCAN、IPアドレスなど">
      <button id="clear" type="button" aria-label="消去">×</button>
    </div>
    <div id="chips"></div>
  </section>

  <section id="listbox" class="box">
    <div class="head"><b id="heading">目次</b><span id="count"></span></div>
    <div id="results"></div>
  </section>

  <section id="viewer" class="box hidden">
    <div class="vhead">
      <button id="back" type="button">← 一覧</button>
      <b id="title"></b>
      <span id="num"></span>
    </div>
    <div id="pageViewport"><img id="pageImage" alt="マニュアルページ"></div>
    <div class="nav">
      <button id="prev" type="button">← 前へ</button>
      <button id="home" type="button">⌂ 目次</button>
      <button id="next" type="button">次へ →</button>
    </div>
  </section>
</main>

"Mac OSでIGなどサーバーへ接続","text":"Mac OSでIGなどサーバーへ接続 エイリアス作成⽅法 Finderの設定で 接続中のサーバーに チェックを⼊れる","strip":"strip-124-126.webp","indexInStrip":2,"stripCount":3},{"page":127,"category":"プリンタ","title":"smb://192.168.***.***","text":"smb://192.168.***.*** 接続先のIPを⼊⼒ 接続できます。 （登録ユーザー、ゲストで を聞いてきたら使⽤する ユーザー名を⼊⼒） 移動から サーバーへ接続","strip":"strip-127-129.webp","indexInStrip":0,"stripCount":3},{"page":128,"category":"プリンタ","title":"フォルダの設定を開く","text":"フォルダの設定を開く Control+クリック もしくは２本指でタップ デスクトップ上に アイコンができます。 この状態だと 再起動すると消えるので 使⽤するフォルダを 選ぶ→OK エイリアス作成","strip":"strip-127-129.webp","indexInStrip":1,"stripCount":3},{"page":129,"category":"プリンタ","title":"次回からエイリアスで","text":"次回からエイリアスで 開くことが可能です これで電源切っても サーバーは消えません。","strip":"strip-127-129.webp","indexInStrip":2,"stripCount":3}];
const el = id => document.getElementById(id);
const q=el("q"), chips=el("chips"), results=el("results"), listbox=el("listbox"),
      viewer=el("viewer"), img=el("pageImage");
let cat="すべて", cur=1;
const cats=["すべて",...new Set(P.map(p=>p.category))];

function norm(v){
  return String(v??"").normalize("NFKC").toLowerCase()
    .replace(/[‐‑‒–—―]/g,"-").replace(/\s+/g," ").trim();
}
function esc(v){
  return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function makeChips(){
  chips.replaceChildren();
  for(const c of cats){
    const b=document.createElement("button");
    b.type="button"; b.className="chip"+(c===cat?" active":""); b.textContent=c;
    b.onclick=()=>{cat=c; makeChips(); render();};
    chips.appendChild(b);
  }
}
function render(){
  const raw=q.value || "";
  const tokens=norm(raw).split(" ").filter(Boolean);
  const arr=P.filter(p=>{
    if(cat!=="すべて" && p.category!==cat) return false;
    if(!tokens.length) return true;
    const hay=norm(`${p.category} ${p.title} ${p.text}`);
    return tokens.every(t=>hay.includes(t));
  });
  el("heading").textContent=raw.trim()?`「${raw.trim()}」の検索結果`:(cat==="すべて"?"目次":cat);
  el("count").textContent=`${arr.length}件`;
  results.replaceChildren();
  if(!arr.length){
    const d=document.createElement("div");
    d.style.cssText="padding:24px;text-align:center;color:#91a5bc";
    d.textContent="該当するページがありません";
    results.appendChild(d);
    return;
  }
  const frag=document.createDocumentFragment();
  for(const p of arr){
    const b=document.createElement("button");
    b.type="button"; b.className="item";
    b.innerHTML=`<span class="top"><span class="badge">${esc(p.category)}</span><span class="ptitle">${esc(p.title)}</span><span class="pg">P.${p.page}</span></span><span class="desc">${esc(p.text.slice(0,150))}</span>`;
    b.onclick=()=>openPage(p.page);
    frag.appendChild(b);
  }
  results.appendChild(frag);
}
function positionPage(p){
  // Every strip holds up to 3 pages, each with the same 910x1287 ratio.
  img.style.transform=`translateY(-${p.indexInStrip * (100 / p.stripCount)}%)`;
}
function openPage(n){
  cur=Math.max(1,Math.min(P.length,Number(n)||1));
  const p=P[cur-1];
  el("title").textContent=`${p.category}｜${p.title}`;
  el("num").textContent=`${cur} / ${P.length}`;
  el("prev").disabled=cur<=1; el("next").disabled=cur>=P.length;

  if(img.dataset.src!==p.strip){
    img.onload=()=>{positionPage(p); img.onload=null;};
    img.src=p.strip;
    img.dataset.src=p.strip;
  } else {
    positionPage(p);
  }
  listbox.classList.add("hidden");
  viewer.classList.remove("hidden");
  window.scrollTo(0,0);
  history.replaceState(null,"",`#p=${cur}`);
}
function showList(){
  viewer.classList.add("hidden");
  listbox.classList.remove("hidden");
  history.replaceState(null,"",location.pathname+location.search);
  window.scrollTo(0,0);
}

/* iPhone/Safari: listen to several events so the search always updates. */
["input","change","keyup","paste","compositionend"].forEach(ev=>q.addEventListener(ev,()=>{
  if(ev==="paste") setTimeout(render,0); else render();
}));
q.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); render(); q.blur(); } });
el("clear").onclick=()=>{q.value=""; render(); q.focus();};
el("back").onclick=showList;
el("toc").onclick=()=>{cat="すべて";q.value="";makeChips();render();showList();};
el("home").onclick=el("toc").onclick;
el("prev").onclick=()=>openPage(cur-1);
el("next").onclick=()=>openPage(cur+1);

makeChips(); render();
const hash=location.hash.match(/p=(\d+)/); if(hash) openPage(Number(hash[1]));
</script>
